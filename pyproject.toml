[project]
name = "git-galaxy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.128.8",
  "numpy==2.0.2",
  "scipy==1.13.1",
  "scikit-learn==1.6.1",
  "igraph==1.0.0",
  "leidenalg==0.12.0",
  "psycopg[binary]>=3.2,<4",
]

[tool.setuptools]
packages = ["server"]
py-modules = ["app"]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "npm --prefix web ci && npm --prefix web run build"
